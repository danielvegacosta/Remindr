
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Testes unitários e build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Executar testes e compilar aplicativo
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Salvar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
